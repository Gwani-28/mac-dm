<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
      width: 240px;
      padding: 14px;
      font-size: 13px;
      color: #1d1d1f;
    }
    h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
    h1 img { width: 18px; height: 18px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
    .muted { color: #86868b; font-size: 12px; line-height: 1.5; }
    input[type="checkbox"] { transform: scale(1.2); }
    select { border: 1px solid #d2d2d7; border-radius: 7px; padding: 5px 7px; background: #fff; font-size: 12px; }
  </style>
</head>
<body>
  <h1><img src="icons/icon32.png" alt="" />Mac DM</h1>
  <div class="row">
    <span id="state">가로채기 켜짐</span>
    <input type="checkbox" id="toggle" checked />
  </div>
  <div id="daemon" class="muted">데몬 상태 확인 중…</div>
  <div class="row">
    <span>영상 화질</span>
    <select id="quality">
      <option value="auto">자동 MP4</option>
      <option value="best">최고화질</option>
      <option value="2160p">2160p</option>
      <option value="1440p">1440p</option>
      <option value="1080p">1080p</option>
      <option value="720p">720p</option>
      <option value="480p">480p</option>
      <option value="360p">360p</option>
    </select>
  </div>
  <button id="capture" style="display:none;width:100%;margin-top:10px;padding:8px;border:none;border-radius:7px;background:#0a84ff;color:#fff;font-weight:600;font-size:13px;cursor:pointer">▶ 이 페이지의 영상 받기</button>
  <div class="muted" style="margin-top:8px">다운로드가 자동으로 Mac DM에 전달됩니다. 링크 우클릭 → "Mac DM으로 다운로드"도 가능합니다.</div>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
