[package]
name = "mac-dm-gui"
version = "0.3.0"
description = "맥 다운로드 매니저 GUI"
edition = "2021"

[lib]
name = "mac_dm_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
